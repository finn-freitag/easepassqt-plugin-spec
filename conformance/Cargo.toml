[workspace]
resolver = "2"
members = ["about", "importer", "database-source", "password-generator", "store-feed", "network"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
wit-bindgen = "0.63.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
